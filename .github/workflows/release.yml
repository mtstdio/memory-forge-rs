name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本 Tag（例如 v3.4.1，留空则自动从 package.json 提取）'
        required: false
        default: ''
      release_notes:
        description: '自定义更新说明（可选）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust-targets: ''
            tauri-args: ''
          - platform: macos-15-intel
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri-args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            rust-targets: ''
            tauri-args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve Release Info
        id: release_info
        shell: bash
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release_info.outputs.tag }}
          releaseName: 'Memory Forge ${{ steps.release_info.outputs.tag }}'
          releaseBody: |
            ## Memory Forge ${{ steps.release_info.outputs.tag }}

            ${{ inputs.release_notes }}

            ### 更新 / Changes

            - Codex：支持多 Profile（实例）独立切换与聚合浏览，自动标记实例 Badge；彻底解决消息擦除在官方 Codex 中仍残留的问题。
            - Kiro IDE：适配新版会话存储位置（`~/.kiro/sessions/<workspace>/sess_<id>/`），修复 Kiro 升级后扫描不到任何会话的问题；旧版路径自动兼容。
            - 新增 ZCode 平台：浏览、编辑 ZCode 的会话记忆，消息时间线包含思考过程（thinking）与工具调用卡片，支持全文搜索与 Markdown 导出。
            - Kiro IDE：时间线直接展示会话内的工具调用（读取新版 messages.jsonl 事件流）。
            - ZCode 会话自动过滤运行时注入的合成消息（todo 提醒、后台通知），只显示真实对话。

            ### 下载 / Download

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | Windows | `*_x64-setup.exe` | 安装包（推荐） |
            | Windows | `*_x64-portable.zip` | 便携版（解压即用） |
            | Windows | `*_x64_en-US.msi` | MSI 安装包 |
            | macOS | `*_universal.dmg` | 通用版（Intel + Apple Silicon） |
            | Linux | `*_amd64.AppImage` | 免安装，双击运行 |
            | Linux | `*_amd64.deb` | Debian/Ubuntu 安装包 |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.tauri-args }}

      - name: Package Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "src-tauri\target\release\memory-forge.exe"
          $tag = "${{ steps.release_info.outputs.tag }}"
          $zip = "Memory.Forge_${tag}_x64-portable.zip"
          Compress-Archive -Path $exe -DestinationPath $zip
          echo "PORTABLE_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Upload Windows portable zip to Release
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release_info.outputs.tag }}" "${{ env.PORTABLE_ZIP }}" --clobber

